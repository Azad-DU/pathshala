name: Build Pathshala Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Pathshala.apk
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Read app version
        id: app_meta
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prebuild Android project
        env:
          EXPO_NO_TELEMETRY: '1'
        run: npx expo prebuild --platform android --no-install

      - name: Build Android Release APK
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          GRADLE_OPTS: '-Xmx3072m -Dorg.gradle.daemon=false'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon

      - name: Rename APK to Pathshala.apk
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Pathshala.apk
          ls -lh Pathshala.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pathshala-v${{ steps.app_meta.outputs.version }}
          path: Pathshala.apk
          if-no-files-found: error

      - name: Publish GitHub Release with Pathshala.apk
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_meta.outputs.version }}
          name: পাঠশালা (Pathshala) v${{ steps.app_meta.outputs.version }}
          files: Pathshala.apk
          make_latest: true
          generate_release_notes: true
